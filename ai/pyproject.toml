[project]
name = "covenant-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "langgraph>=1.1.5",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=1.0",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
covenant = "covenant_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covenant_ai"]
exclude = ["**/.edgar_cache/**", "**/__pycache__/**", "**/*.pyc", "**/.covenant-reviewer"]

[project.optional-dependencies]
dev = ["pytest"]
