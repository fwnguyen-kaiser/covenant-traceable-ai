[project]
name = "covenant-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "langgraph>=1.1.5", "langchain>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covenant_ai"]

[project.optional-dependencies]
dev = ["pytest"]